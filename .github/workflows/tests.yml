name: Tests

# Pull requests and branches other than main (main is tested by the daily update).
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Python tests (offline)
        run: python -m pytest -q tests
      - name: Site click-through (headless DOM)
        run: |
          python scraper/scrape.py --offline --out /tmp/jobs.json --notify /tmp/notify --no-llm
          npm install --no-save --no-audit --no-fund jsdom@24
          node tests/ui/ui_smoke.js /tmp/jobs.json
