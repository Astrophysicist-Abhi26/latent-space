      first, then entry-level ML / research-engineer / data roles; frontier AI labs get a boost. India, remote and
      abroad all count; roles that need a PhD or senior experience are pushed down.
    interests:
      ml: high
      ml.prob: top
      ml.dl: 92
      ml.core: 88
      ml.llm: 85
      ml.safety: 80
      ml.eng: 62
      ml.rl: 60
      ml.cv: 55
      ds: 75
      ds.ts: 90
      ds.ds: 75
      sci: 70
      sci.climate: 95
      sci.physics: 85
      sci.bio: 40
      quant: 60
      quant.research: 70
      math: 60
      math.math: 70
      swe: 20
    cross_field: 0.25
    kinds: {internship: 20, technician: 14, fellowship: 14, scientist: 10, other: 6, phd: -60, postdoc: -60, faculty: -60}
    sectors: {ai-lab: 14, tech: 8, quant: 6, ai-bio: 4, academic: 4, industry: 2, nonprofit: 2}
    labs: {wet: -20, hybrid: 0, dry: 4, unknown: 0}
    regions: {india: 12, remote: 10, north-america: 6, europe: 6, asia-pacific: 4, middle-east: 0, africa: 0, latin-america: 0, unknown: 0}
    coding: 6
    senior: -30
    needs_phd: -25
    visa: {sponsors: 6, no-sponsorship: -25, unknown: 0}
    cv: 25
