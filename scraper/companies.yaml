# Latent Space — company job boards (frontier AI labs, AI companies, AI for science, quant)
#
# Read through each board's public API (sources_ats.py). Every role a company lists is
# fetched; only machine-learning, data and quant roles are kept.
#
# ats       greenhouse | lever | ashby | workable | workday
# slug      the board name in the API URL   (workday: host, tenant, site, queries)
# group     ai-lab (frontier AI lab) | tech (AI & tech company) | quant | ai-bio (AI for biology) | nonprofit
# country   ISO-2 fallback when a role names no location
# verified  true = the board was seen live in Nov 2026. false = the company's usual board name,
#           not yet confirmed: `python scraper/doctor.py --probe <slug>` finds the right one.

companies:
