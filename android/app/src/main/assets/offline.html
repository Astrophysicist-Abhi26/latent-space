<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latent Space is offline</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070b1f;color:#f2efff;font-family:system-ui,sans-serif;text-align:center;padding:24px}
.dish{width:120px;height:120px;border-radius:50%;border:6px solid #fff;margin:0 auto 22px;background:radial-gradient(circle at 42% 36%,#ffe6f0,#ee76a6)}
p{margin:0 auto;color:#a39cc7;max-width:30ch;line-height:1.5}
button{margin-top:18px;background:#ff5aa2;color:#fff;border:0;border-radius:999px;padding:12px 22px;font-size:16px;font-weight:700}
</style></head>
<body><main><div class="dish"></div><h1 style="margin:0 0 8px;font-size:24px">No connection</h1>
<p>Latent Space needs the internet the first time it opens. After that, the last positions stay readable offline.</p>
<button onclick="window.AndroidBridge ? AndroidBridge.goHome() : location.reload()">Try again</button></main></body></html>
