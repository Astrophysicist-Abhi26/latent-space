plugins {
    id 'com.android.application'
}

// The GitHub workflow passes the site address and a build number; these defaults are for local builds.
def siteUrl = project.findProperty('siteUrl') ?: 'https://astrophysicist-abhi26.github.io/latent-space/'
def buildNumber = (project.findProperty('versionCode') ?: '1').toString().toInteger()

android {
    namespace 'io.github.astrophysicistabhi26.latentspace'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.astrophysicistabhi26.latentspace'
        minSdk 26
        targetSdk 34
        versionCode buildNumber
        versionName "1.${buildNumber}"
        buildConfigField 'String', 'SITE_URL', "\"${siteUrl}\""
    }
    buildFeatures {
        buildConfig true
    }
    // A fixed key (committed on purpose) so every new build installs over the previous one.
    signingConfigs {
        release {
            storeFile file('latentspace.keystore')
            storePassword 'latentspace'
            keyAlias 'latentspace'
            keyPassword 'latentspace'
            storeType 'pkcs12'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
